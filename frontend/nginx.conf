server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://windsight-api-99a5.onrender.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Host windsight-api-99a5.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass https://windsight-api-99a5.onrender.com/docs;
        proxy_http_version 1.1;
        proxy_set_header Host windsight-api-99a5.onrender.com;
    }

    location /openapi.json {
        proxy_pass https://windsight-api-99a5.onrender.com/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host windsight-api-99a5.onrender.com;
    }
}